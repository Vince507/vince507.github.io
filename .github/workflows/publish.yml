name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A6DDDF: ${{ secrets.A6DDDF }}
          BB0C5F: ${{ secrets.BB0C5F }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A6DDDF', '')
          bm = os.environ.get('BB0C5F', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 2daaaae93cc416834f1dac6ab47c29eb88f22a59 -->', gm)
          if bm:
              s2 = s2.replace('<!-- 129a813ee183581b -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
